# workloadctl: workload users never log in over sshd.
#
# A workload user (_wl-NAME) has nologin and a locked password, but sshd
# with UsePAM accepts a key from the user's own authorized_keys, which the
# workload's tree holds. nologin refuses the shell and leaves forwarding,
# so a key planted there would be a standing login to the host's loopback
# and LAN. Nothing logs in as a workload user: the routes into a workload
# run as an admin account through `workloadctl exec`.
DenyUsers _wl-*
