# ============================================================================
# workload.toml key reference
# ============================================================================
# Every key a workload.toml can carry, table by table: what it is, its type,
# default and accepted values, the rule you are most likely to trip on, and
# the manual chapter that explains it. The chapters are in
# docs/manual/ and carry complete, validated examples; this file has none.
#
# Key lines are commented out. Table headers are live, so the file parses as
# TOML, but it is not a workload: it declares a container and a VM at once.
#
# A workload is a container ([container], or [[containers]] for several) or a
# VM ([vm]), never two of these. Where a key exists on one substrate only, its
# entry says so.
#
# Within a table, scalars come before its [[...]] arrays of tables, which is
# the order a real file needs: the first [[...]] header ends its parent table,
# so a scalar written below it belongs to that array entry instead. TOML
# accepts that silently, and does not let the parent be declared again lower
# down.
#
# Chapter files named under "See" are in docs/manual/.
# ============================================================================

[workload]

# The workload's name. Required, and must match its directory,
# /etc/workloads.d/<name>/. It names the user _wl-<name>, the unit
# workload-<name>.service and the tree /var/lib/workloads/<name>/.
# Type: string, ^[a-z][a-z0-9-]*$, at most 27 characters.
# See: 01-concepts.md
# name = "webserver"

# The bundle whose control files (Containerfile, build script, [host] setup
# script, policy.cil) this workload uses, from
# /usr/share/workloadctl/workloads/<bundle>/. `init --as` and `duplicate`
# set it, so one bundle serves several instances.
# Type: string, the same rules as name. Default: the workload's name.
# See: 04-containers.md "Changing a bundle's files"
# bundle = "vncdesktop-wayfire"

# What happens to the workload's writable state.
# "cattle": a container is created afresh at every start; a VM's system disk
# is rebuilt by `update`, which keeps earlier generations for rollback.
# "pet": a container is created once and its writable layer kept, saved as a
# snapshot before `update` or `recreate` replace it; a VM keeps its system
# disk, and `update` only restarts it.
# Type: string, "cattle" | "pet". Default: "cattle".
# A multi-container workload runs as cattle whatever this says (validate warns).
# See: 04-containers.md "Cattle or pet"; 05-vms.md "Pet and cattle"
# lifecycle = "cattle"

# How many snapshots of a pet container's writable layer to keep, as
# localhost/workload-snapshot/<name>:<timestamp>. Ignored for cattle. A VM's
# equivalent is [vm].rollback_keep.
# Type: integer >= 1. Default: 3.
# See: 09-operating.md "Pet snapshots"
# snapshot_keep = 3

# Workloads started along with this one (systemd Wants=). This one starts even
# if they fail, and no order is implied.
# Type: array of workload names. Default: [].
# Container workloads only: a VM's TOML accepts the key and ignores it.
# validate warns about a name that matches no workload on the host.
# See: 09-operating.md "Ordering workloads"
# requires = ["db"]

# Workloads this one waits for when they start at the same time (systemd
# After=). It does not start them; for "start db first", name it in both keys.
# Type: array of workload names. Default: []. Container workloads only, as
# requires.
# after = ["db"]

# How a workload's containers share the network.
# "single": one [container]. "pod": [[containers]] in one network namespace,
# reaching each other on localhost. "bridge": [[containers]] each in its own
# namespace on the network workload-<name>-net, reaching each other by name.
# Type: string. Default: "single" with [container], "pod" with [[containers]].
# Refused: "pod" or "bridge" with [container]; "single" with [[containers]].
# See: 04-containers.md "Pod or bridge"
# mode = "pod"


# ============================================================================
# CONTAINER WORKLOADS
# ============================================================================
# A single-container workload uses the top-level tables in this part. A
# workload of several containers moves the per-container ones under
# [[containers]] (the next part).
# See: 04-containers.md

[container]

# The image to run, as any reference podman accepts. Required.
# Type: string.
# See: 04-containers.md "The image and what it runs"
# image = "docker.io/library/nginx:alpine"

# What to run, replacing the image's CMD.
# Type: array of strings. Default: the image's own.
# command = ["sleep", "infinity"]

# The user the container runs as (podman --user), by UID or name.
# Type: string. Default: the image's USER; in a pod-mode member under keep-id,
# the pod's keep-id user.
# See: 04-containers.md "Who owns the files"; 08-security.md "User namespaces"
# user = "0"

# When podman pulls the image as the service starts.
# Type: string, "missing" | "always" | "newer" | "never". Default: "missing".
# `update` pulls whatever this says, except "never". For an image you build
# with `workloadctl build`, a copy in root's image store wins whatever this
# says. validate refuses any other value.
# See: 04-containers.md "When the image is pulled", "Building your own image"
# pull = "missing"

# Whether the container brings its own init. Any value removes podman's --init.
# "always": podman's systemd mode, for an image that runs systemd as PID 1.
# "true": podman detects a systemd entry point itself. "false": no systemd
# mode, for an image with an init of its own. "always" and "true" also stop
# the container with SIGRTMIN+3.
# Type: string, "always" | "true" | "false". Default: unset (podman's --init
# as PID 1). validate refuses any other value.
# See: 04-containers.md "Containers that run systemd"
# systemd = "always"

[container.environment]

# Environment variables, one key each.
# Type: table of strings. Default: {}.
# A value may contain ${SECRET:name}, as the whole value or part of one: the
# secret is loaded for this workload without being listed anywhere else, and
# must be a single line. $${SECRET:name} is the literal text.
# See: 04-containers.md "Environment"; 07-secrets.md "As an environment variable"
# PUBLIC_URL = "https://app.example.com"
# API_KEY = "${SECRET:app-api-key}"

[container.health]

# A check podman runs inside the container on a timer; `cmd` turns it on.
# See: 04-containers.md "Health checks"

# The check, run through the image's /bin/sh. Exit 0 is healthy.
# Type: string. Default: unset (no check).
# cmd = "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"

# Time between checks.
# Type: duration, one number and one unit ("30s", "5m"). Default: "30s".
# `update` reads interval and start_period, and cannot read "1m30s".
# interval = "30s"

# Longest one check may run. Type: duration. Default: "30s".
# timeout = "30s"

# Failures in a row that make the container unhealthy.
# Type: integer. Default: 3.
# retries = 3

# Grace period after start in which failures do not count.
# Type: duration. Default: none.
# start_period = "60s"

# What happens when the container turns unhealthy.
# "none": it is only marked. "kill": podman kills it, the unit fails and
# systemd restarts it 5 s later, counted where monitoring sees it. "restart":
# podman restarts the container in place and the unit stays active. "stop":
# the container stops and the unit stays down.
# Type: string. Default: "none".
# on_failure = "kill"

[storage]

# What is mounted into the container, each "host:container[:options]".
# Host side: "./x" is /var/lib/workloads/<name>/data/x, which `backup`
# captures; "@/x" is /var/lib/workloads/<name>/state/volumes/x, which it does
# not; an absolute path is used as written and must already exist. workloadctl
# creates ./ and @/ directories, owned by the workload user and labelled for it.
# Options: podman's ("ro", "Z", ...), and "rro" for read-only all the way down.
# Type: array of strings. Default: [].
# Refused: "data" or "state" as a named volume (they are anchors); ".." out
# of an anchor; "rro" beside slave, rslave, shared or rshared propagation.
# validate errors on an absolute host path that does not exist.
# The workload's own directory is always /var/lib/workloads/<name>/; there is
# no other [storage] key.
# See: 04-containers.md "Volumes"
# volumes = ["./config:/config:ro", "@/cache:/var/cache/app", "/var/mnt/media:/media:ro"]

[[shares]]

# One table per share this workload belongs to. A share is a host directory
# several workloads use, declared once in /etc/workloads.d/shares.toml:
#
#   [shares.downloads]
#   path = "/var/mnt/downloads"
#   category = 512
#
# There, `path` is an absolute directory outside /var/lib/workloads, and
# `category` (optional, 300-1023, derived from the name by default) is the
# SELinux category every member holds. A writer joins the group
# wl-share-<name>; a reader joins wl-share-<name>-ro, which has a read ACL.
# Container workloads only: [[shares]] on a VM is refused.
# See: 04-containers.md "Sharing a directory between workloads"

# The share's name in shares.toml. Required. Type: string.
# name = "downloads"

# Where the containers see it. Required.
# Type: string, an absolute path, used once per workload.
# target = "/downloads"

# "write" joins the share's writers; "read" joins its readers and mounts it
# read-only. Required. Type: string, "read" | "write".
# access = "read"

# A directory inside the share to mount instead of its root.
# Type: string, relative, no "..". Default: the share's root.
# subpath = "complete"

# In a multi-container workload, the containers that mount it.
# Type: array of container names. Default: every container. Refused in a
# single-container workload.
# containers = ["app"]

[devices]

# Device nodes passed in (podman --device), or CDI names such as
# "nvidia.com/gpu=0".
# Type: array of strings. Default: [].
# A device directory (/dev/snd, /dev/input, /dev/bus/usb) goes in [storage]
# volumes instead: --device fixes the list of nodes when the container is
# created. The workload user needs the device's group in extra_groups.
# See: 04-containers.md "Device nodes"
# devices = ["/dev/ttyUSB0"]

# GPU access. "amd": /dev/kfd and /dev/dri. "nvidia": every NVIDIA GPU through
# CDI, and /dev/dri. "nvidia:<spec>": one GPU by its CDI name from
# `nvidia-ctk cdi list`, an index or (stable) a UUID, with only that card's
# DRM nodes. "intel": /dev/dri. "auto": the vendor of the host's first GPU,
# detected when the units are generated. "none": nothing.
# Type: string. Default: "none".
# Needs extra_groups: "video" and "render" for amd, "video" for nvidia.
# See: 04-containers.md "GPUs, input and audio"
# gpu = "amd"

# /dev/input, mounted, and /dev/uinput.
# Type: boolean. Default: false. Needs extra_groups = ["input"].
# input = true

# /dev/snd, mounted, and the workload user's PulseAudio and PipeWire sockets.
# Type: boolean. Default: false. Needs extra_groups = ["audio"].
# audio = true

[secrets]

# Secrets mounted as files. Each entry has `credential` (the secret's name,
# required), `path` (where it appears in the container, required) and `mode`
# ("ro" or "rw", default "ro"). Create the secret first with
# `workloadctl secret create`; validate reports one that is missing.
# A ${SECRET:name} in an environment value needs no entry here.
# Type: array of inline tables. Default: [].
# In a multi-container workload use [containers.secrets]: the generator does
# not read a top-level [secrets] there.
# See: 07-secrets.md "As a file"
# files = [{ credential = "app-tls-key", path = "/etc/app/tls/key.pem" }]

[security]

# How the containers are confined.
# In a multi-container workload, extra_groups, privileged, selinux_policy,
# unsafe_host_userns, the seccomp_* keys and kernel_modules stay in this
# top-level table; capabilities and security_opt go in each
# [containers.security]; userns and the ID maps are top-level in pod mode and
# per container in bridge mode.
# A VM reads only selinux_policy, and refuses the seccomp_* keys and
# kernel_modules.
# See: 08-security.md

# The container's user namespace.
# "keep-id": the workload user keeps its UID inside, and every other UID maps
# into its subordinate range. "keep-id:uid=N,gid=N": the workload user is N
# inside; "keep-id:uid=0,gid=0" makes container root the workload user.
# "host": the host's user namespace, refused without unsafe_host_userns.
# Type: string. Default: "keep-id". Any other value: the generator warns and
# uses "keep-id" (validate warns too).
# See: 08-security.md "User namespaces"
# userns = "keep-id"

# Acknowledges userns = "host". Without it validate refuses the workload and
# the generator skips it. status and diagnose show it.
# Type: boolean. Default: false. Top-level [security] only.
# unsafe_host_userns = false

# Host groups the workload user joins, for device access (video, render,
# input, audio, dialout, kvm, ...). Under keep-id each group's GID is mapped
# into the container at the same number.
# Type: array of group names. Default: []. validate errors on a group the
# host does not have.
# See: 04-containers.md "Device nodes"; 08-security.md "Explicit ID maps"
# extra_groups = ["video", "render"]

# Further ID maps, in podman's syntax "+<container id>:@<host id>:<count>".
# {UID} and {GID} stand for the workload user's IDs. A host ID must be one
# the workload user may map: its own UID or GID, one in its subordinate range,
# or an extra_groups GID; podman refuses to start the container otherwise.
# When two maps name one host ID the later wins, which is how an ID is moved;
# the generator warns. Read under every keep-id form, ignored under "host".
# Type: array of strings. Default: [].
# See: 08-security.md "Explicit ID maps"
# extra_uidmaps = []
# extra_gidmaps = ["+44:@39:1"]   # host GID 39 (video, in extra_groups) appears as 44

# Capabilities added to the container's set (podman --cap-add), named without
# CAP_. It only adds: nothing in the TOML removes one of podman's defaults.
# Type: array of strings. Default: [].
# See: 08-security.md "Capabilities"
# capabilities = ["NET_ADMIN"]

# Options passed to podman --security-opt as written, such as:
#   seccomp=<path>   a profile that replaces the seccomp baseline
#   SELinux labelling: label=type:<type>, label=level:<level>, label=disable
#   no-new-privileges
# Type: array of strings. Default: [].
# The one key that expands ${WORKLOAD_NAME}, ${WORKLOAD_INSTANCE_DIR},
# ${WORKLOAD_ROOT_DIR}, ${WORKLOAD_STATE_DIR} and ${WORKLOAD_DATA_DIR}.
# validate refuses those tokens in any other key, and refuses any other
# ${WORKLOAD_*} token.
# See: 08-security.md "Seccomp", "SELinux"
# security_opt = ["seccomp=${WORKLOAD_INSTANCE_DIR}/seccomp.json"]

# Syscalls allowed on top of the seccomp baseline, in a profile derived for
# this workload (/run/systemd/system/workload-<name>.seccomp.json) and rebuilt
# with its units. A pet container keeps its old profile until `recreate`.
# Type: array of syscall names. Default: [].
# Refused, for all three seccomp_* keys: under [containers.security], beside
# a seccomp= security_opt, with privileged = true, and on a VM.
# See: 08-security.md "Opening it for one workload"
# seccomp_allow = ["ptrace", "process_vm_readv", "process_vm_writev"]

# Netlink protocols the baseline refuses, allowed back: "generic" (wg and
# wg-quick configure WireGuard through it) and "sock_diag" (ss).
# Type: array of strings. Default: [].
# seccomp_netlink = ["generic"]

# Lets the derived profile run 32-bit x86 code, which the baseline kills as
# "Bad system call" (exit status 159). Steam's client needs it.
# Type: boolean. Default: false.
# seccomp_32bit = true

# Kernel modules the workload's setup unit loads with modprobe before its
# containers start. One that fails to load stops the workload starting.
# Type: array of module names. Default: [].
# Top-level [security] only; container workloads only.
# See: 08-security.md "Kernel modules"
# kernel_modules = ["wireguard"]

# Loads the bundle's policy.cil as the SELinux module wl_<name> at enable and
# removes it at disable. A container then runs as wl_<name>.process. A VM
# always runs as svirt_t, so its policy.cil is written against svirt_t.
# Type: boolean. Default: false. Top-level [security] only.
# validate warns about a filecon in policy.cil for a path under
# /var/lib/workloads or /run/workload-vm, which never takes effect.
# See: 08-security.md "A policy of the workload's own", "VMs"
# selinux_policy = false

# Runs the container privileged: every capability, every device node the
# workload user can open, no seccomp filter and no SELinux label of its own.
# The generator warns.
# Type: boolean. Default: false. Top-level [security] only: a value in
# [containers.security] is ignored, without a warning.
# See: 08-security.md "Capabilities"
# privileged = false

[network]

# A container's network, and its egress filtering.
# See: 04-containers.md "Networking"; 06-networking.md

# The network podman gives a single or pod workload: "pasta" (a namespace of
# its own, connected to the host by pasta), "host" (the host's namespace),
# "none", or the name of a podman network the workload user created.
# Type: string. Default: "pasta".
# Refused: "host" beside any egress key below, in single and pod mode. Bridge
# mode never reads this key.
# mode = "pasta"

# Ports published on the host, podman's "[ip:][hostPort:]containerPort[/proto]".
# Type: array of strings. Default: [].
# Not read with mode "host" or "none", nor in bridge mode (validate warns;
# publish in [containers.network] there).
# Refused: any character but letters, digits and ":.[]-/".
# ports = ["8080:80", "127.0.0.1:9000:9000"]

# --- Egress filtering ------------------------------------------------------
# Off until a workload has any of hosts, [[network.allow]] or
# [[network.policy]]. Any one of them turns it on, and then everything the
# workload sends that nothing allows is dropped. A container has no `egress`
# key; one written here is ignored.
# A VM has the same keys under [vm.network], filtered by default. Each VM
# entry below says only where it differs from the container entry here.
# The image pull is the workload's own traffic, so a registry not in hosts
# is refused once filtering is on (06-networking.md "The image pull").
# On pasta in single or pod mode the workload's DNS is answered by its own
# responder on the host. In bridge mode, or on a podman network of your own,
# it goes to the host's nameservers as the workload's traffic, so a resolver
# elsewhere on the LAN needs a [[network.allow]] entry on port 53
# (06-networking.md "DNS under filtering").
# Apply a change with `workloadctl recreate`.
# See: 06-networking.md "Filtering a container", "The same keys on both substrates"

# Host names the workload may reach on ports 80 and 443, as fnmatch patterns
# matched against the HTTP Host header or the TLS SNI, case-insensitively.
# "*.example.com" does not match "example.com": list the apex too.
# Type: array of strings. Default: [].
# Refused: a scheme, path or port in a pattern; "*" alone.
# See: 06-networking.md "Allowing hosts by name"
# hosts = ["example.com", "*.example.com"]

# What the inspector does with an allowed TLS connection.
# "inspect": terminates it with the workload's own CA and authorises every
# request inside by its Host header, so policy entries can apply.
# "splice": checks the SNI once and relays the bytes undecrypted.
# Under "inspect", a host that requires a client certificate, or whose
# certificate this host cannot verify, answers 502, and anything but HTTP/1.1
# on 443 is closed: splice such a host with [[network.splice]].
# Type: string, "inspect" | "splice". Default: "inspect" when any
# [[network.policy]] entry exists, otherwise "splice".
# Refused: "splice" written without tls_reason; "splice" written beside a
# policy entry.
# See: 06-networking.md "Terminating or splicing TLS"
# tls = "splice"

# Why the whole workload is spliced. Free text, read by nobody at runtime.
# Type: string. Required with tls = "splice" written out, refused otherwise.
# tls_reason = "vendor image; its trust store cannot be changed"

# How the workload's CA reaches the container when its TLS is inspected.
# "env": SSL_CERT_FILE, NODE_EXTRA_CA_CERTS, REQUESTS_CA_BUNDLE, GIT_SSL_CAINFO
# and PIP_CERT name the CA bundle. "mount": the bundle is mounted at
# ca_mount_path for the image's entrypoint to install. "image": the image was
# built trusting the CA. Nothing checks the claim against the image.
# Type: string, "env" | "mount" | "image". Default: unset, which validate
# refuses whenever the effective tls is "inspect".
# Container workloads only: a VM gets the CA through its cloud-init seed.
# See: 06-networking.md "Trusting the workload's CA"
# ca_delivery = "env"

# Where ca_delivery = "mount" puts the CA bundle in the container.
# Type: string, an absolute path. Required with ca_delivery = "mount",
# refused otherwise.
# ca_mount_path = "/etc/pki/workload-ca/ca.crt"

[[network.allow]]

# A destination on a port other than 80 and 443: SSH, a database, NTP, a DNS
# server. One table per destination and port.
# See: 06-networking.md "Destinations on other ports"

# The destination: exactly one of `host` (a name, resolved on the host when
# the filter is armed and pinned to that answer until `recreate`) or
# `address` (one IPv4 or IPv6 address, not a range).
# Type: string.
# host = "git.example.com"
# address = "192.0.2.10"

# The port. Type: integer 1-65535, one port. Refused: 80 and 443, which go to
# the inspector (use hosts or [[network.policy]]).
# validate warns about 53 when the workload has its own responder (single or
# pod mode on pasta): it hands the workload a resolver past the responder.
# port = 22

# Why the hole exists. Required. Type: string.
# reason = "backup target over SSH"

[[network.internal]]

# An allowed name meant to resolve to a private address (RFC 1918, loopback,
# link-local). The inspector otherwise refuses to connect there, with
# "403 <host> resolves to an internal address".
# `host` is an fnmatch pattern that must overlap a hosts pattern or a
# [[network.policy]] host; `reason` is required. Accepted under tls = "splice".
# The name is resolved when the filter is armed, and if it does not resolve to
# a private address there, the workload does not start. validate warns when it
# cannot resolve the name.
# See: 06-networking.md "Names that resolve into your network"
# host = "git.internal"
# reason = "the LAN forge, over HTTPS"

[[network.splice]]

# An allowed host whose TLS is relayed undecrypted on a workload that
# otherwise inspects: for a client that pins its certificate or cannot take
# the workload's CA, or a host that speaks something other than HTTP/1.1 on
# 443 (HTTP/2 included).
# `host` is an fnmatch pattern that must overlap a hosts pattern; `reason` is
# required.
# Refused: on a container whose effective tls is already "splice"; for a host
# a [[network.policy]] entry also matches.
# See: 06-networking.md "Terminating or splicing TLS"
# host = "sum.golang.org"
# reason = "the client verifies a signed log, not the CA chain"

[[network.policy]]

# Methods and paths allowed on an inspected host.
# A host that any entry matches is governed by entries alone; a host in hosts
# that no entry matches is allowed any method and path. An entry also allows
# its host, so it need not be listed in hosts. Entries that match one host
# add together; none can take anything away.
# On a container the first entry makes the effective tls "inspect", so
# ca_delivery becomes required.
# See: 06-networking.md "Methods and paths", "How entries combine"

# The host. Required. Type: fnmatch pattern, case-insensitive.
# host = "api.example.com"

# HTTP method names, case-insensitive. Omitted: any method.
# Type: array of strings.
# Refused: a name that is not a registered HTTP method; CONNECT; PRI; [].
# methods = ["POST"]

# Paths, as fnmatch patterns over the path alone (no query), case-sensitive.
# Omitted: any path.
# Type: array of strings, each starting with "/", with no "?" or "#".
# Refused: [].
# paths = ["/v1/messages"]

# A [[network.credential]] block whose material the workload's broker attaches
# to this host's requests. Type: string.
# Refused: a name no block declares; a credential on a wildcard host.
# credential = "example-api"

# Also refused: an entry that omits methods or paths when another entry
# matches the same host; a wildcard entry that leaves an apex in hosts with no
# rules ("*.example.com" beside hosts = ["example.com"] and no entry for the
# apex); tls = "splice" written beside any entry; a host also spliced.

[[network.credential]]

# Material the broker attaches to requests for a host whose policy entry names
# it. The workload holds only a placeholder. The real key is sealed with
# `workloadctl secret create broker/<workload>/<name>`.
# Refused: a block that no policy entry selects.
# See: 06-networking.md "Keeping API keys out of the workload";
#      07-secrets.md "Credentials for the broker"

# The credential's name. Required, unique.
# Type: string of letters, digits, "_" and "-".
# name = "example-api"

# The stand-in value the workload holds. Required, and not the real key.
# Type: string.
# placeholder = "placeholder-not-a-real-key"

# The environment variable the placeholder is put in. Required.
# Type: string, a shell variable name, used by one block only.
# Refused: SSL_CERT_FILE, NODE_EXTRA_CA_CERTS, REQUESTS_CA_BUNDLE,
# GIT_SSL_CAINFO and PIP_CERT, which carry the CA.
# env = "EXAMPLE_API_KEY"

# The header the broker sets. Type: string. Default: "x-api-key".
# Refused: a header that frames the message or is hop-by-hop (Host,
# Content-Length, Transfer-Encoding, Connection, ...).
# auth_header = "Authorization"

# The header's value. Type: string naming {secret} exactly once and nothing
# else. Default: "{secret}".
# auth_format = "Bearer {secret}"

[resources]

# Resource limits. In a single-container workload this one table limits the
# workload, on its user manager (user@<uid>.service), and its container,
# through podman flags. In a multi-container workload this table sets the
# workload-wide limits and slice, and each [containers.resources] limits one
# container and carries that container's service_type, timeouts and
# custom_directives. A VM applies these keys to its QEMU service unit, except
# shm_size and service_type.
# See: 04-containers.md "Resource limits"; 05-vms.md "Sizing"

# The slice the workload runs in. workloads.slice limits all workloads
# together; "system.slice" leaves those limits.
# Type: string, a slice unit name. Default: "workloads.slice". Workload-wide.
# See: 04-containers.md "The workloads slice"
# slice = "workloads.slice"

# Hard CPU limit as a share of one core, "200%" being two cores: CPUQuota=,
# and podman --cpus for a container.
# Type: string, "N%". Default: none.
# cpu_quota = "100%"

# CPU priority under contention: CPUWeight=. In [containers.resources] it
# becomes podman's --cpu-shares, which reads the number on another scale.
# Type: integer 1-10000. Default: none (systemd's 100).
# cpu_weight = 100

# Hard memory limit, past which processes are killed: MemoryMax=, and podman
# --memory for a container. Pair it with memory_swap_max = "0" for a real cap.
# Type: string, a size ("512M", "2G"). Default: none.
# memory_max = "2G"

# Soft limit, above which memory is reclaimed hard: MemoryHigh=.
# Type: string, a size. Default: none. Workload-wide only: ignored, with a
# warning, in [containers.resources].
# memory_high = "1.5G"

# Swap limit, "0" for none: MemorySwapMax=.
# Type: string, a size. Default: none. Workload-wide only: ignored in
# [containers.resources].
# memory_swap_max = "0"

# Disk priority under contention: IOWeight=.
# Type: integer 1-10000. Default: none (systemd's 100). Workload-wide only:
# ignored in [containers.resources].
# io_weight = 100

# Per-device bandwidth, "<device> <rate>": IOReadBandwidthMax= and
# IOWriteBandwidthMax=, and podman --device-read-bps / --device-write-bps for
# a container.
# Type: array of strings. Default: [].
# io_read_bandwidth_max = ["/dev/sda 50M"]
# io_write_bandwidth_max = ["/dev/sda 50M"]

# Processes and threads: TasksMax=, and podman --pids-limit for a container.
# Type: integer. Default: none (podman's own 2048 per container).
# tasks_max = 512

# Size of the container's /dev/shm (podman --shm-size).
# Type: string, a size ("256m", "2g"). Default: podman's 64m. Containers only.
# shm_size = "2g"

# The container unit's systemd Type=. Leave it "exec": with "notify" the unit
# hangs in "activating", because the readiness message comes from the
# workload user's manager. Containers only.
# Type: string, simple | exec | forking | oneshot | dbus | notify | idle.
# Default: "exec". Any other value: the generator warns and uses "exec".
# See: 04-containers.md "Service type and timeouts"
# service_type = "exec"

# How long systemd lets the unit take to start (TimeoutStartSec=).
# Type: integer seconds, or a systemd time span. Default: 300.
# timeout_start_sec = 300

# How long the unit may take to stop (TimeoutStopSec=). Written as whole
# seconds it also gives the container that many seconds less five to exit
# before podman kills it; otherwise the container gets 10.
# Type: integer seconds, or a systemd time span. Default: 30; 90 for a VM.
# timeout_stop_sec = 30

# Further [Service] directives, written verbatim into the unit that runs
# podman (for a VM, its QEMU unit). Nothing checks them: a typo fails the unit.
# validate warns about a directive workloadctl sets itself. A cgroup limit
# written here does not reach the containers; use the keys above.
# Type: table of strings. Default: {}.
# custom_directives = { LimitNOFILE = "65536" }

# The same table as a sub-table, written after every other [resources] key:
[resources.custom_directives]
# LimitNOFILE = "65536"
# OOMScoreAdjust = "-500"

[build]

# Marks the container's image as one built on the host, and says how
# `workloadctl build` builds it: into root's image store, tagged as
# [container].image, from where enable, recreate and update copy it to the
# workload user. An empty [build] is enough to mark it; an image with
# pull = "never" needs no table at all.
# In a multi-container workload this table holds inputs inherited by every
# container without a [containers.build] of its own.
# See: 04-containers.md "Building your own image", "Several images in one workload"

# The Containerfile, relative to the build directory (the bundle's directory
# with /etc/workloads.d/<name>/ laid over it).
# Type: string, no "..". Default: "Containerfile".
# containerfile = "Containerfile"

# Fixed build arguments. They are recorded in the image's history, so never
# pass a secret this way.
# Type: table of strings. Default: {}.
# args = { FEDORA_VERSION = "44" }

# Host environment variables passed as build arguments when set, overriding
# args. Top-level only; it applies to every image the workload builds.
# Type: array of variable names. Default: [].
# arg_env = ["GPU_TYPE"]

# The stage of a multi-stage build. Type: string. Default: the last stage.
# target = "runtime"

# A script run instead of the built-in builder. It receives the build
# directory and the image tag as arguments, and WL_BUILD_CONTEXT, WL_TAG and
# WL_IMAGE in its environment; for several images, only the first tag.
# Type: string, a control file of the bundle. Default: none.
# script = "build.sh"

[host]

# A script run as root with the argument "enable" at `workloadctl enable` and
# "disable" at `disable`, for what the host needs (a udev rule, a service of
# its own). It must be executable and safe to repeat. A failure on enable
# stops the workload being started. Its environment names the instance:
# WORKLOAD_NAME, WORKLOAD_BUNDLE, WORKLOAD_USER, WORKLOAD_INSTANCE_DIR,
# WORKLOAD_ROOT_DIR, WORKLOAD_STATE_DIR and WORKLOAD_DATA_DIR. Run with
# "artifacts", it prints what it installs, one "unit <name>" or "file <path>"
# per line.
# Type: string. A relative name is looked up in /etc/workloads.d/<name>/,
# then in the bundle. Default: none. Container and VM workloads.
# See: 04-containers.md "Host setup scripts"
# setup = "setup.sh"

[setup]

# Files that must exist before `enable` starts the workload; enable names
# those missing and how to put them in place. Each entry has `path`
# (required, with the ./ and @/ anchors of [storage] volumes) and `hint`
# (optional, a file to copy from). Volume directories need no entry.
# Type: array of inline tables. Default: []. Container workloads only.
# See: 04-containers.md "Files the workload needs first"
# required_files = [{ path = "./smb.conf", hint = "/usr/share/workloadctl/workloads/smb-server/smb.conf" }]


# ============================================================================
# SEVERAL CONTAINERS: [[containers]]
# ============================================================================
# One [[containers]] table per container, in place of [container]; never
# both. Each table below belongs to the [[containers]] entry above it.
# These stay top-level and workload-wide: [workload]; [network] (mode and
# ports in pod mode, egress filtering in both); [security] (see its notes);
# [resources] (workload-wide limits and slice); [build] (inherited inputs);
# [[shares]], [host] and [setup]. The generator reads no top-level
# [container], [storage], [devices] or [secrets] here.
# The unit workload-<name>.service starts each container's
# workload-<name>-<container>.service; commands take <name>/<container>.
# See: 04-containers.md "Several containers in one workload", "What goes where"

[[containers]]

# The container's name. Required, unique in the workload.
# Type: string, ^[a-z][a-z0-9-]*$, at most 27 characters.
# name = "web"

[containers.container]

# image (required), command, pull, systemd and user, as in [container].
# environment and health may also be written as [containers.container.environment]
# and [containers.container.health], but one container may not use both forms.
# image = "registry.example.com/app:1.4"

[containers.environment]

# This container's environment, as [container.environment].
# LISTEN_ADDR = "127.0.0.1:3000"

[containers.health]

# This container's health check: cmd, interval, timeout, retries,
# start_period and on_failure, as [container.health].
# cmd = "pg_isready -U app"

[containers.security]

# capabilities and security_opt for this container; in bridge mode also
# userns, extra_uidmaps and extra_gidmaps. In pod mode those three are
# top-level: a userns here is ignored with a warning, the maps without one.
# The seccomp_* keys and kernel_modules are refused here; selinux_policy is
# ignored with a warning; privileged and extra_groups are ignored.
# capabilities = ["CHOWN"]

[containers.build]

# This container's image recipe: containerfile (default "Containerfile"),
# target and args, as [build]. It describes the image whole and does not merge
# with the top-level [build]; arg_env stays top-level. It also marks the
# image as built on the host. Containers sharing one built image must
# describe it identically, or validate and build refuse.
# containerfile = "Containerfile.vpn"

[containers.storage]

# This container's volumes, as [storage].
# volumes = ["./db:/var/lib/postgresql/data"]

[containers.devices]

# This container's devices, gpu, input and audio, as [devices].
# gpu = "intel"

[containers.secrets]

# This container's files, as [secrets].
# files = [{ credential = "app-tls-key", path = "/etc/app/tls/key.pem" }]

[containers.resources]

# This container's own limits inside the workload's: cpu_quota, memory_max,
# io_read_bandwidth_max, io_write_bandwidth_max, tasks_max and shm_size, and
# cpu_weight as --cpu-shares (see [resources]). memory_high is ignored with a
# warning; memory_swap_max and io_weight are ignored. Also service_type,
# timeout_start_sec, timeout_stop_sec and custom_directives, for this
# container's unit.
# memory_max = "1G"

[containers.network]

# ports published from this container, in bridge mode. Pod mode publishes in
# the top-level [network], and does not read this table.
# ports = ["3000:3000"]


# ============================================================================
# VM WORKLOADS
# ============================================================================
# A [vm] table makes the workload a KVM/QEMU virtual machine. It cannot be
# combined with [container] or [[containers]]. Of the tables above, a VM reads
# [workload], [resources], [host] and [security] selinux_policy.
# See: 05-vms.md

[vm]

# Virtual CPUs. Type: integer >= 1. Default: 2.
# See: 05-vms.md "Sizing"
# vcpus = 2

# Guest memory in QEMU notation: a number of MiB, or a string such as "2048M"
# or "4G".
# Type: integer or string, at least 256 MiB. Default: 2048 (MiB).
# memory = "4G"

# --- Image source: exactly one of cloud_image_url, local_image and image ---
# See: 05-vms.md "Image sources"

# A disk image downloaded once into /var/lib/workloads/<name>/.image-cache/
# and copied to the system disk; one in another format than qcow2 is converted.
# file:// URLs work. Requires cloud_image_checksum.
# Type: string, a URL.
# cloud_image_url = "https://download.example.org/images/guest.qcow2"

# The image's checksum, checked every time the cached copy is used.
# Type: string, "sha256:" and the hex digest; no other algorithm.
# cloud_image_checksum = "sha256:<64 hex digits>"

# A qcow2 file on the host, copied (reflinked where possible) at every build.
# Nothing checks it. Type: string, a path.
# local_image = "/var/lib/images/guest.qcow2"

# A bootc container image, made into a disk with bootc-image-builder, which
# must be installed. Type: string, an image reference.
# image = "quay.io/example/guest:latest"

# --- Disks ------------------------------------------------------------------
# See: 05-vms.md "Disks", "The data disk"

# Grows the system disk to this size whenever it is built; cloud-init grows
# the root partition to fill it on first boot.
# Type: string, a size with a unit ("20G", "512M"); a bare number is refused.
# Default: the image's own size.
# system_disk_size = "20G"

# Creates /var/lib/workloads/<name>/data/data.qcow2, a second disk
# (/dev/vdb in the guest), which the built-in seed formats and mounts at
# /data. It is created when the system disk is built, so decide before the
# first enable; a new size does not resize an existing disk.
# Type: string, a size with a unit. Default: none (no data disk).
# data_disk_size = "50G"

# How many older system disks (system.qcow2.gen-N) to keep for rollback,
# beside the one an update has just made: at most rollback_keep + 1.
# Type: integer >= 1. Default: 2.
# See: 05-vms.md "Update and rollback"
# rollback_keep = 2

# --- Running ----------------------------------------------------------------

# The guest account `shell` and `exec` log in as. A seed of your own must
# create it. Type: string. Default: "workload".
# See: 05-vms.md "Getting into the guest"
# user = "fedora"

# What the VM's unit does when QEMU exits. "always": start again after a guest
# reboot, a guest power-off or a crash. "on-failure": only after a crash.
# "on-reboot": after a guest reboot or a crash, not a power-off. A
# `workloadctl stop` or `disable` is never undone.
# Type: string, "always" | "on-failure" | "on-reboot". Default: "always".
# See: 05-vms.md "Running the VM"
# restart = "always"

# A virtio-balloon device with free-page reporting, so the host takes back
# memory the guest frees. Type: boolean. Default: true.
# See: 05-vms.md "Sizing"
# balloon = true

# --- Sharing host directories -------------------------------------------------
# See: 05-vms.md "Sharing host directories"

# Host directories shared into the guest over virtiofs, each
# "host:guest[:options]". "./x" and "@/x" anchor as a container's volumes do;
# any other host path must already exist. The options are the guest's mount
# options: "ro" is not enforced on the host. A share over the guest's home
# works: the workload's SSH key is added to it on the host, unless its host
# path is outside /var/lib/workloads/<name>/. A host path out there needs an
# SELinux type virtiofsd may use (05-vms.md "A host path outside the
# workload's directory").
# Type: array of strings. Default: [].
# volumes = ["./projects:/home/fedora/projects", "/srv/media:/mnt/media:ro"]

# Host mount points each virtiofsd is ordered after, for a filesystem
# mounted inside a share (a CIFS or NFS mount under ./home). Ordering only:
# the VM starts whether or not the mount is there.
# Type: array of paths, absolute or with the ./ @/ data/ state/ anchors.
# Default: [].
# See: 05-vms.md "A filesystem mounted inside a share"
# after_mounts = ["./home/netmnt"]

# Tells the guest where a host mount nested in a share begins, so it gets a
# device number of its own. Turn it off only for a guest kernel without
# virtio-fs submount support.
# Type: boolean. Default: true.
# announce_submounts = true

[vm.network]

# A VM's network. By default the guest runs behind passt: its traffic leaves
# as host sockets owned by the workload user, it has no LAN address of its
# own, it cannot reach the host's loopback or main address, and it cannot
# resolve ".local" names.
# A VM is filtered by default, and a filtered VM must name somewhere to go
# (hosts, [[vm.network.allow]] or [[vm.network.policy]]) or set
# egress = "open"; validate refuses one that names nothing, including a VM
# with no [vm.network] at all.
# See: 06-networking.md "Choosing a stance for a VM"; 05-vms.md "The guest's network"

# "filtered": everything the VM sends is dropped except ports 80 and 443
# through its inspector (hosts, policy) and [[vm.network.allow]] destinations.
# "open": no filtering, and DNS goes to the host's resolver.
# Type: string, "filtered" | "open". Default: "filtered".
# Refused with egress = "open": hosts, tls, tls_reason and the internal,
# splice and policy tables.
# egress = "filtered"

# Attaches the VM to a host bridge you created and allowed in
# /etc/qemu/bridge.conf, giving it an address on that LAN. Such a VM is
# outside the host's filtering.
# Type: string, an interface name (letters, digits, "_", "-"; at most 15).
# Default: unset (passt).
# Refused beside it: ports, outbound_if, egress and every filtering key.
# bridge = "br0"

# Ports published from the guest on the host,
# "[addr:]hostport[:guestport][/tcp|/udp]", an IPv6 addr in brackets.
# Type: array of strings. Default: [].
# Refused: a bind address in 127.128.0.0/9 (the management addresses `exec`
# uses) or in 198.18.0.0/16 or 2001:2::/48 (the inspectors').
# See: 05-vms.md "Publishing ports"
# ports = ["8080:80", "127.0.0.1:9090:9090", "5353:53/udp"]

# Binds passt's outbound sockets to one host interface, in both address
# families.
# Type: string, an interface name (letters, digits, "_", ".", "-"; at most
# 15). Default: unset (routing decides).
# outbound_if = "eno1"

# "host": passt gives the guest a resolver. A filtered VM's queries are
# answered by its own responder and never leave the host; an open VM's go to
# the host's resolver. "none": the guest has no resolver at all.
# Type: string, "host" | "none". Default: "host".
# Refused: "none" on a filtered VM with hosts, internal, splice or policy
# entries, or an allow entry written by name. validate warns about "none" on
# any filtered VM. A container has no such key.
# See: 06-networking.md "DNS under filtering"
# resolver = "host"

# As [network].hosts. validate also warns about a wildcard under a domain
# where anyone can register a name ("*.github.io").
# hosts = ["fedoraproject.org", "*.fedoraproject.org"]

# As [network].tls, except that the default is always "inspect". The guest
# trusts the workload's CA through its cloud-init seed.
# tls = "inspect"

# As [network].tls_reason: required with tls = "splice", refused otherwise.
# tls_reason = "appliance image; its trust store cannot be changed"

[[vm.network.allow]]

# A destination on a port other than 80 and 443, as [[network.allow]], with
# the destination and port in one `address`: "<addr>:<port>",
# "[<IPv6 addr>]:<port>" or "<name>:<port>". A name is resolved on the host
# when the VM starts; if it does not resolve, the start fails.
# Both keys required.
# Refused: port 80 or 443 on a filtered VM; an address (or a name resolving
# to one) in 198.18.0.0/16 or 2001:2::/48. validate warns about port 53.
# See: 06-networking.md "Destinations on other ports"
# address = "192.0.2.10:22"
# reason = "backup target over SSH"

[[vm.network.internal]]

# As [[network.internal]]. The name is resolved when the VM starts, and the
# VM does not start if that fails.
# host = "git.internal"
# reason = "the LAN forge, over HTTPS"

[[vm.network.splice]]

# As [[network.splice]]. Accepted, and changes nothing, under tls = "splice".
# Also refused: a wildcard entry that leaves an apex in hosts inspected.
# host = "sum.golang.org"
# reason = "the client verifies a signed log, not the CA chain"

[[vm.network.policy]]

# As [[network.policy]]: host, methods, paths, credential. Refused under
# tls = "splice" and egress = "open".
# host = "api.example.com"
# methods = ["POST"]
# paths = ["/v1/messages"]
# credential = "example-api"

[[vm.network.credential]]

# As [[network.credential]]: name, placeholder, env, auth_header, auth_format.
# The guest gets the placeholder from the built-in seed, once per instance.
# name = "example-api"
# placeholder = "placeholder-not-a-real-key"
# env = "EXAMPLE_API_KEY"

[vm.cloud_init]

# Replaces the built-in seed's user-data with a file of your own. Without this
# table workloadctl writes a seed with the login user and its SSH key, the
# share mounts, the data disk and, on a filtered VM, the egress CA.
# See: 05-vms.md "A seed of your own", "What a seed file must carry"

# The #cloud-config file, used whole: nothing is merged into it. A relative
# path is looked up in the directory of the workload's TOML, then in the
# bundle's local layer, then in the shipped bundle; an absolute path is used
# as written.
# It is substituted when the seed is built: ${VAR} (template_vars, then the
# environment), ${SECRET:name} (a sealed secret; a missing one fails the
# build), ${SECRET?name} (empty when missing), $$ (a literal $), and the
# WORKLOADCTL_* variables: the workload's SSH key, the login user and the
# guest's SSH host key, which a seed must install for `exec` to work. An
# unresolved ${VAR} fails the build.
# Type: string. Default: unset (the built-in seed).
# user_data_file = "./cloud-init/user-data"

# Concerns this seed handles itself, each turning off the check that refuses
# a seed without it: "mounts" (it mounts every [vm].volumes share), "ca" (it
# installs the egress CA on a filtered VM), "home_context" (it labels a share
# over the guest's home so sshd can read it). It silences the check; it does
# not do the work, so declare one only when the guest image really does.
# Type: array of strings. Default: []. Refused: any other entry.
# seed_provides = ["mounts"]

# Values for ${VAR} in user_data_file.
# Type: table of strings, integers, floats or booleans. Default: {}.
# template_vars = { REPO_URL = "https://git.example.com/me/project.git" }

# The same table as a sub-table, written after the keys above:
[vm.cloud_init.template_vars]
# REPO_URL = "https://git.example.com/me/project.git"
# VERSION = "1.4.2"
