# vncdesktop-labwc — labwc Wayland desktop served over VNC
#
# labwc runs in headless wlroots mode; wayvnc serves it on TCP 5900.
# GPU acceleration via /dev/dri/renderD* if available, falls back to software.
#
# Keyboard shortcuts (Ctrl+Alt is the primary modifier — Super is typically
# intercepted by the local DE before reaching the VNC server):
#   Ctrl+Alt+Return         - Terminal (foot)
#   Ctrl+Alt+Space          - App launcher (fuzzel)
#   Ctrl+Alt+V              - Clipboard history picker
#   Ctrl+Alt+Q              - Close window
#   Ctrl+Alt+F              - Toggle maximize
#   Ctrl+Alt+H/J/K/L        - Snap left / down / up / right
#   Ctrl+Alt+Tab            - Next window
#   Ctrl+Alt+1..4           - Switch workspace
#   Ctrl+Alt+Shift+1..4     - Move window to workspace
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build vncdesktop-labwc
#
#   2. Enable the workload:
#        sudo workloadctl enable vncdesktop-labwc
#
#   3. Connect over ssh. wayvnc listens on the host's loopback only and
#      asks for no login; ssh is the login and the encryption:
#        vncviewer -via user@hypervisor localhost:5900
#      or, for any VNC client:
#        ssh -L 5900:localhost:5900 user@hypervisor
#        vncviewer localhost:5900

[workload]
name = "vncdesktop-labwc"

[container]
image = "registry.local/workloads/vncdesktop-labwc:latest"
pull = "missing"

[container.environment]
# DESKTOP_RESOLUTION = "1920x1080"
LANG = "C.UTF-8"
NO_AT_BRIDGE = "1"

[container.health]
cmd = "pgrep -x wayvnc > /dev/null || exit 1"
interval = "30s"
start_period = "15s"
on_failure = "kill"

[devices]
# Optional render node for GPU-accelerated rendering. Falls back to software
# rendering automatically if no /dev/dri/renderD* is exposed.
gpu = "auto"

[storage]
volumes = [
    "./home:/home/desktop",
]

[security]
userns = "keep-id:uid=1000,gid=1000"
extra_groups = ["video", "render"]
selinux_policy = true

[network]
mode = "host"

[resources]
shm_size = "2G"
memory_max = "4G"
memory_high = "3G"
cpu_quota = "200%"
tasks_max = 16384

# Marks the image locally buildable: `workloadctl build` produces the same
# ref into root's store, which overrides the registry copy on the next
# enable/update. CI publishes the canonical copy to registry.local.
[build]
