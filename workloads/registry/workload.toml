# Container Registry - Docker Registry v2 for local image storage
# Serves container images on this host's loopback, at http://localhost:5000
#
# It has no authentication: anyone who reaches it can pull AND push, and so
# replace any image a client pulls from it. To serve the LAN, give it
# htpasswd auth (REGISTRY_AUTH=htpasswd and a mounted htpasswd file) before
# publishing the port wider and opening the firewall. The zot-registry
# bundle does both.
#
# Setup:
#   1. Enable the workload (volume directories are created automatically):
#        sudo workloadctl enable registry
#
#   2. Test the registry:
#        curl http://localhost:5000/v2/_catalog
#
#   3. Configure clients to use the registry:
#        Add to /etc/containers/registries.conf or ~/.config/containers/registries.conf:
#
#        [[registry]]
#        location = "<host>:5000"
#        insecure = true
#
# Usage:
#   Push: podman tag myimage:latest <host>:5000/myimage:latest
#         podman push <host>:5000/myimage:latest
#   Pull: podman pull <host>:5000/myimage:latest
#   List: curl http://<host>:5000/v2/_catalog
#
# Garbage collection (cleanup deleted images):
#   sudo workloadctl exec registry registry garbage-collect /etc/docker/registry/config.yml

[workload]
name = "registry"

[container]
image = "docker.io/library/registry:2"

[container.health]
cmd = "wget -qO- http://localhost:5000/v2/ > /dev/null || exit 1"
interval = "30s"
start_period = "10s"
on_failure = "kill"

[container.environment]
# Optional: Enable deletion (and updates!) of images
REGISTRY_STORAGE_DELETE_ENABLED = "true"
REGISTRY_LOG_LEVEL = "info"

[storage]
volumes = [
    "./:/var/lib/registry"
]

[network]
mode = "pasta"
ports = ["127.0.0.1:5000:5000"]

[resources]
# Registry doesn't send systemd ready notifications, use simple type
service_type = "simple"
memory_max = "256M"
memory_high = "192M"
cpu_quota = "50%"
