name: Build Workload Images

# Builds the self-built workload container images (the `pull = never`,
# localhost/<name>:latest bundles) and publishes them to the homelab registry
# as registry.local/workloads/<name>:<tag>. This is what lets a host consume a
# prebuilt image (registry.local/workloads/<name>:latest + pull=missing,
# refreshed via `workloadctl update`) instead of running `workloadctl build`
# locally on every box.
#
# Mostly dormant: on push it only rebuilds the workloads whose bundle actually
# changed (these images rarely move). workflow_dispatch can force a subset or
# all. Bundle images are ordinary OCI builds — no rechunk, no bootc plumbing —
# so this is a much lighter pipeline than the hypervisor image's, which it
# otherwise mirrors (native runner, registry.local, signed with the runner's
# sealed key, the one the hypervisor repository's seal-signing-key.yml seals).

on:
  workflow_dispatch:
    inputs:
      workloads:
        description: 'Workloads to build: "all", or a space/comma list of names'
        required: true
        default: 'all'
        type: string
  # Weekly, every bundle: an image is otherwise rebuilt only when its bundle
  # changes, and the packages in it go stale (audit F26).
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'workloads/**'
      # Docs never reach an image, so a README edit should not trigger a build
      # + signing round that moves :latest to a new digest for no content
      # change. Belt and braces: ci-workload-images.py applies the same rule
      # when it computes the matrix, so if this negation is not honoured the
      # run still resolves to an empty matrix and skips the build job.
      - '!workloads/**/*.md'
      - '.forgejo/workflows/build-workload-images.yml'
      - '.forgejo/scripts/ci-workload-images.py'
      - '.forgejo/scripts/moatery-root'
      - '.forgejo/scripts/ci-scan.py'
      - '.forgejo/cve-allowlist.txt'

concurrency:
  group: build-workload-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: native
    outputs:
      workloads: ${{ steps.r.outputs.workloads }}
      any: ${{ steps.r.outputs.any }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, not a fixed depth. The push diff below needs
          # github.event.before, which can sit arbitrarily deep: a batched push
          # of N commits, or a merge commit whose first parent is the old tip.
          # If it isn't in the clone the diff is skipped and the run degrades
          # silently to building *every* bundle. Repo is small; depth 0 is cheap.
          fetch-depth: 0

      - name: moatery, unpacked
        # workloadctl's modules import it: its newest release, from its Copr
        # repository with its signature checked, unpacked and not installed.
        run: |
          site=$(.forgejo/scripts/moatery-root "$RUNNER_TEMP/moatery-root")
          echo "PYTHONPATH=$site" >> "$GITHUB_ENV"

      - name: Test the CI helper
        # Pure-function coverage for ci-workload-images.py (ref rewriting, the
        # [[build.variants]] arg_env cross-check). Milliseconds, no podman, no
        # registry — and it guards the step immediately below. Deliberately not
        # part of `just test`: importing the helper exports WORKLOAD_*_DIR at
        # module scope and would poison the shared-process suite.
        run: |
          python3 .forgejo/scripts/test_ci_workload_images.py
          python3 .forgejo/scripts/test_ci_scan.py

      - name: Compute build matrix
        id: r
        env:
          EVENT: ${{ github.event_name }}
          SELECT: ${{ inputs.workloads }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Only rebuild bundles touched by this push. If the before-sha is
            # unknown (new branch / all-zeros), fall back to building all.
            if git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only "${BEFORE}" "${SHA}")"
            else
              # Announce it: this fallback builds everything, so a silent hit
              # looks like a legitimately huge matrix rather than a broken diff.
              echo "::warning::before-sha ${BEFORE} not resolvable — building all workloads"
              CHANGED_FILES=""
              SELECT="all"
            fi
            export CHANGED_FILES
          fi
          export SELECT
          WORKLOADS="$(python3 .forgejo/scripts/ci-workload-images.py list)"
          echo "workloads=${WORKLOADS}" >> "$GITHUB_OUTPUT"
          # 'any' gates the build job so an empty matrix (nothing changed) is a
          # clean no-op instead of a matrix-expansion error.
          if [ "$(echo "$WORKLOADS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          # One dated tag shared by the whole run, alongside :latest — gives a
          # pinned, rollback-able reference for each image.
          echo "tag=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "Selected: ${WORKLOADS}"

  build:
    needs: setup
    if: needs.setup.outputs.any == 'true'
    runs-on: native
    timeout-minutes: 120
    env:
      REGISTRY: registry.local
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJson(needs.setup.outputs.workloads) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: moatery, unpacked
        # workloadctl's modules import it: its newest release, from its Copr
        # repository with its signature checked, unpacked and not installed.
        run: |
          site=$(.forgejo/scripts/moatery-root "$RUNNER_TEMP/moatery-root")
          echo "PYTHONPATH=$site" >> "$GITHUB_ENV"

      - name: Build image
        env:
          NAME: ${{ matrix.workload }}
          REFS_OUT: /tmp/wl-refs-${{ github.run_id }}-${{ matrix.workload }}.txt
        run: |
          : > "$REFS_OUT"
          # Build into root's store (matches the hypervisor pipeline). The
          # helper reuses lib/imagebuild.py so this is exactly what
          # `workloadctl build ${NAME}` produces, tagged for the registry.
          sudo env REGISTRY="${REGISTRY}" REFS_OUT="${REFS_OUT}" \
            PYTHONPATH="${PYTHONPATH}" python3 .forgejo/scripts/ci-workload-images.py build "${NAME}"

      - name: Scan for fixable critical vulnerabilities
        env:
          NAME: ${{ matrix.workload }}
          REFS_OUT: /tmp/wl-refs-${{ github.run_id }}-${{ matrix.workload }}.txt
        run: |
          # Before the push: an image with a critical that has a fix, or one
          # that could not be scanned, never reaches the registry. Accepted
          # ones go in .forgejo/cve-allowlist.txt with a reason.
          if ! command -v grype >/dev/null; then
            echo "::error::grype is not installed on the runner; refusing to push an unscanned image"
            exit 1
          fi
          # An OCI layout directory, not an archive: grype unpacks an
          # oci-archive with a 2 GiB cap on each entry, which a CUDA layer
          # exceeds. The layout and grype's layer cache go on the disk, not
          # in /tmp: a CUDA image overfills the runner's /tmp.
          LAYOUT="/var/tmp/wl-scan-${{ github.run_id }}-${NAME}"
          SCAN="/var/tmp/wl-scan-${{ github.run_id }}-${NAME}.json"
          GRYPE_TMP="/var/tmp/wl-scan-${{ github.run_id }}-${NAME}.tmp"
          trap 'sudo rm -rf "$LAYOUT" "$SCAN" "$GRYPE_TMP"' EXIT
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            sudo rm -rf "$LAYOUT" "$GRYPE_TMP"
            sudo mkdir "$GRYPE_TMP"
            sudo podman save --format oci-dir -o "$LAYOUT" "$ref"
            if ! sudo env TMPDIR="$GRYPE_TMP" grype "oci-dir:${LAYOUT}" \
                -o json --file "$SCAN"; then
              echo "::error::grype could not scan ${ref}"
              exit 1
            fi
            sudo chmod a+r "$SCAN"
            python3 .forgejo/scripts/ci-scan.py judge "$ref" "$SCAN" \
              .forgejo/cve-allowlist.txt
          done < "$REFS_OUT"

      - name: Push and sign
        env:
          NAME: ${{ matrix.workload }}
          TAG: ${{ needs.setup.outputs.tag }}
          REFS_OUT: /tmp/wl-refs-${{ github.run_id }}-${{ matrix.workload }}.txt
        run: |
          # Sign at push via containers/image — same sealed-key setup as the
          # hypervisor repository's build-hypervisor.yml (no cosign CLI; its
          # *.local scheme race broke signing). Key + passphrase are
          # host-key-sealed systemd credentials in the runner's tmpfs; missing
          # creds fail the job.
          # This step's own files: jobs run side by side on the runner, and a
          # digest read from a shared path can be another job's.
          WORK=$(mktemp -d)
          trap 'sudo rm -rf "$WORK"' EXIT
          CREDS=/run/credentials/forgejo-runner.service
          if ! sudo test -s "${CREDS}/cosign-key"; then
            echo "::error::no signing credential at ${CREDS}/cosign-key — refusing to push unsigned. Run the hypervisor repository's seal-signing-key workflow, then re-run this build."
            exit 1
          fi
          SIGN_ARGS=(--sign-by-sigstore-private-key "${CREDS}/cosign-key"
                     --sign-passphrase-file "${CREDS}/cosign-pass")
          if ! sudo test -s "${CREDS}/registry-auth"; then
            echo "::error::no registry login at ${CREDS}/registry-auth — run the hypervisor repository's seal-registry-auth workflow, then re-run this build."
            exit 1
          fi
          AUTH_ARGS=(--authfile "${CREDS}/registry-auth")

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            repo="${ref%:*}"     # strip the tag
            reftag="${ref##*:}"  # latest, or a [[build.variants]] suffix
            # Qualify the dated tag per variant. A bundle with variants emits
            # several refs on the SAME repo (:latest, :cuda, ...); an unqualified
            # dated tag would be written once per ref and the last push through
            # this loop would silently win, leaving a rollback ref that points at
            # whichever variant happened to be last. :latest keeps the bare dated
            # tag so existing single-image bundles are unaffected.
            if [ "$reftag" = "latest" ]; then
              dated="${TAG}"
            else
              dated="${reftag}-${TAG}"
            fi
            sudo podman push "${AUTH_ARGS[@]}" "${SIGN_ARGS[@]}" --digestfile "$WORK/digest" "$ref"
            DIGEST=$(cat "$WORK/digest")
            # A push can succeed without attaching a signature; the shipped policy.json
            # then refuses the image, so verify the attachment resolves and validates
            # before anything downstream consumes this digest.
            printf '{"default":[{"type":"reject"}],"transports":{"docker":{"%s":[{"type":"sigstoreSigned","keyPath":"%s","signedIdentity":{"type":"matchRepository"}}]}}}' \
              "${repo}" "$(pwd)/.forgejo/cosign.pub" > "$WORK/verify-policy.json"
            if ! sudo podman pull -q --signature-policy="$WORK/verify-policy.json" "${repo}@${DIGEST}" >/dev/null; then
              echo "::error::signature verification failed for ${repo}@${DIGEST} — the push did not produce a valid signature"
              exit 1
            fi
            echo "signature verified: ${repo}@${DIGEST}"
            # Dated tag = pinned rollback ref; digest copy is already covered by
            # the digest-addressed signature.
            sudo skopeo copy "${AUTH_ARGS[@]}" "docker://${repo}@${DIGEST}" "docker://${repo}:${dated}"
            {
              echo "- \`${ref}\`"
              echo "- \`${repo}:${dated}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$REFS_OUT"

      - name: Cleanup local tags
        if: always()
        env:
          NAME: ${{ matrix.workload }}
          REFS_OUT: /tmp/wl-refs-${{ github.run_id }}-${{ matrix.workload }}.txt
        run: |
          # Drop the localhost/<name> build tag and the registry tag this job
          # created; zot holds the source of truth. Dangling prune reclaims the
          # layers on the long-lived native runner without touching the build
          # cache or other workloads' tagged images.
          sudo podman untag "localhost/${NAME}:latest" 2>/dev/null || true
          if [ -f "$REFS_OUT" ]; then
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              sudo podman untag "$ref" 2>/dev/null || true
            done < "$REFS_OUT"
            rm -f "$REFS_OUT"
          fi
          df -h /
          sudo podman image prune -f || true
          df -h /
