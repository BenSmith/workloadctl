name: test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: native
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure build tooling
        run: |
          for pkg in just rpm-build python3; do
            bin=${pkg/rpm-build/rpmbuild}
            command -v "$bin" >/dev/null || sudo dnf install -y "$pkg"
          done
          # Macro packages provide no binary to probe; install unconditionally.
          # Required by the spec's BuildRequires (%{_unitdir}, %{python3_sitelib}).
          # libseccomp's Python binding: without it the seccomp baseline's
          # libseccomp tests skip, and the profile is checked only against
          # the suite's own model of libseccomp.
          sudo dnf install -y systemd-rpm-macros python3-rpm-macros \
            libseccomp-python
          python3 --version
          just --version

      # workloadctl requires moatery, and the unit suite imports it: main's,
      # from this forge's RPM registry with its signature checked.
      - name: Install moatery
        env:
          REPO: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/rpm
        run: |
          rpm=$(mktemp --suffix=.rpm)
          sudo .forgejo/scripts/forge-moatery-rpm "$REPO" "$rpm"
          sudo dnf install -y "$rpm"
          sudo rm -f "$rpm"

      # The unit suite runs as a non-root user, exactly as it does on the gate
      # host. Run as root on this runner, the suite writes real
      # /var/lib/workloads/<name> trees that the selinux_labels checks then
      # read as mislabeled (var_lib_t). As a normal user it cannot create them,
      # and the checks read "unknown" and pass. `fedora` is the VM's [vm].user,
      # created by the seed; the workspace is chowned to it first so the suite
      # can write where it runs.
      - name: Make the workspace writable by the test user
        run: chown -R fedora:fedora "$GITHUB_WORKSPACE"

      - name: Lint (py_compile)
        run: runuser -u fedora -- just lint

      - name: Unit tests
        run: runuser -u fedora -- just test

      - name: Build RPM
        run: |
          # This runs on a persistent `native` runner, so the workspace can carry
          # untracked files between runs and `just rpm-build` only ever adds to
          # rpmbuild/. Left alone, the artifact glob below matches every RPM
          # the runner has ever built — an old package attached to a green run.
          # As the test user, who owns the checkout: git refuses root a
          # repository another user owns, and the RPM then names no commit.
          rm -rf rpmbuild
          runuser -u fedora -- just rpm-build

      - name: Upload RPM artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: workloadctl-rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error


      # main's RPMs, to this forge's RPM registry: the dnf repository the
      # homelab's hypervisor images install workloadctl from.
      - name: Publish RPMs
        if: github.event_name == 'push'
        env:
          PKG_PUBLISH_TOKEN: ${{ secrets.PKG_PUBLISH_TOKEN }}
          UPLOAD: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/rpm/upload
        run: |
          set -- rpmbuild/RPMS/noarch/workloadctl-*.rpm
          if [ "$#" -ne 2 ]; then
            echo "::error::expected workloadctl and workloadctl-vm, got: $*"
            exit 1
          fi
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for rpm; do
            code=$(curl -sS -o "$log" -w '%{http_code}' \
              -H "Authorization: token ${PKG_PUBLISH_TOKEN}" \
              --upload-file "$rpm" "$UPLOAD")
            if [ "$code" != 201 ]; then
              echo "::error::uploading $rpm: HTTP $code"
              cat "$log"
              exit 1
            fi
            echo "published $(basename "$rpm")"
          done
