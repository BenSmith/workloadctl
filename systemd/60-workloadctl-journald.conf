# workloadctl: journald broadcasts nothing to logged-in terminals.
#
# journald walls every emerg entry by default. A workload writes entries:
# through its unit's stream, where the generator sets SyslogLevelPrefix=no,
# and in some bundles through the journal socket, where an entry sets its
# own PRIORITY. Either way a workload could put text and terminal escape
# sequences of its choosing on every operator's terminal. The entries stay
# in the journal at the priority they carry.

[Journal]
ForwardToWall=no
